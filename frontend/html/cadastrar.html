<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros - Biblioteca</title>
    <!-- Caminho corrigido: volta uma pasta para achar a pasta css -->
    <link rel="stylesheet" href="../css/cadastrar.css">
    <link rel="icon" type="image/png" href="../img/logo.png">
</head>
<body>

    <div class="container">
        <div class="topo-nav">
            <!-- Caminho corrigido: volta uma pasta para achar o index.html -->
            <a href="../index.html" class="btn-voltar">← Voltar ao Início</a>
        </div>

        <h1>Cadastro de Livros</h1>

        <form> 
            <div class="campo-grupo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ex: Java para Iniciantes" required>
            </div>

            <div class="campo-grupo">
                <label for="autor">Autor:</label>
                <input type="text" id="autor" name="autor" placeholder="Ex: Gustavo Guanabara" required>
            </div>

            <div class="campo-grupo">
                <label for="ano">Ano de Publicação:</label>
                <input type="number" id="ano" name="ano" placeholder="Ex: 2020" required>
            </div>

            <div class="campo-grupo">
                <label for="genero">Gênero:</label>
                <select id="genero" name="genero" required>
                    <option value="">Selecione o gênero</option>
                    <option value="ficcao">Ficção</option>
                    <option value="romance">Romance</option>
                    <option value="aventura">Aventura</option>
                    <option value="fantasia">Fantasia</option>
                    <option value="terror">Terror</option>
                    <option value="biografia">Biografia</option>
                    <option value="autoajuda">Autoajuda</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <button type="submit" class="btn-acao">Cadastrar Livro</button>
        </form>

        <div class="tabela-container">
            <h2>Livros Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Ano</th>
                        <th>Gênero</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Java para Iniciantes</td>
                        <td>Gustavo Guanabara</td>
                        <td>2020</td>
                        <td>Ensino</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
