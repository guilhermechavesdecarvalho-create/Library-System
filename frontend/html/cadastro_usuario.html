<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Biblioteca Senac</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <h2>Criar Nova Conta</h2>
                <p>Cadastre-se para acessar o sistema</p>
            </div>

            <form id="form-cadastro-usuario">
                <div class="campo-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">E-mail institucional</label>
                    <input type="email" id="email" placeholder="seu.email@senac.br" required>
                </div>

                <div class="campo-grupo">
                    <label for="senha">Palavra-passe</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-acao">Cadastrar Conta</button>
            </form>

            <div class="login-footer" style="margin-top: 25px; text-align: center;">
                <a href="../index.html">← Voltar para o Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('form-cadastro-usuario').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Conta criada com sucesso!');
            window.location.href = '../index.html';
        });
    </script>

</body>
</html>
