<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar acesso | Biblioteca Senac</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>

<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-brand">
            <div class="brand-mark">B</div>
            <p class="eyebrow">BIBLIOTECA SENAC</p>
            <h1>Seu acesso, com segurança.</h1>
            <p>Para proteger sua conta, a redefinição de senha precisa de um processo de verificação.</p>
        </section>
        <section class="auth-content">
            <div class="auth-card"><a class="back-link" th:href="@{/}">← Voltar ao login</a>
                <p class="eyebrow">RECUPERAÇÃO DE ACESSO</p>
                <h2>Esqueceu sua senha?</h2>
                <p class="muted">Informe o e-mail da conta. A recuperação automática ainda não está habilitada neste
                    ambiente.</p>
                <div class="alert alert-error" th:if="${erro}" th:text="${erro}" role="alert"></div>
                <form th:action="@{/recuperar-senha}" method="post" class="form-stack">
                    <div class="field"><label for="email">E-mail cadastrado</label><input id="email" name="email"
                            type="email" required></div><button class="button button-primary button-wide"
                        type="submit">Solicitar ajuda</button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
